<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14161a" />
  <title>wesl-shadertoy</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #14161a;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      min-width: 100vw;
      min-height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Rust emits bulk-memory ops; trunk's bundled wasm-opt needs them enabled. -->
  <link data-trunk rel="rust" data-wasm-opt="2"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
  <script>
    // Drop the canvas on unload so the browser reclaims the GPU context
    // promptly (pattern borrowed from omdurman's index.html).
    window.addEventListener('beforeunload', function () {
      document.querySelectorAll('canvas').forEach(function (c) { c.remove(); });
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    // Auto-reload when the WebGL context is lost (GPU switch, sleep, ...).
    new MutationObserver(function () {
      var c = document.querySelector('canvas');
      if (c && !c.dataset.glh) {
        c.dataset.glh = '1';
        c.addEventListener('webglcontextlost', function (e) {
          e.preventDefault();
          setTimeout(function () { window.location.reload(); }, 500);
        });
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
