<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#282828" />
  <title>wesl-shadertoy</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #282828;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* winit writes an inline `width/height` px style on the canvas that can
       disagree with the real viewport; !important keeps the canvas exactly
       viewport-sized and winit's ResizeObserver resizes the buffer to match. */
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- Rust emits bulk-memory ops; trunk's bundled wasm-opt needs them enabled. -->
  <link data-trunk rel="rust" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
  <script>
    // Ctrl/Cmd+S and Ctrl/Cmd+O are app shortcuts (save / open); keep the
    // browser's own save/open dialogs from popping up. Capture phase, no
    // stopPropagation, so egui still receives the key events.
    window.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey &&
          (e.key === 's' || e.key === 'S' || e.key === 'o' || e.key === 'O')) {
        e.preventDefault();
      }
    }, true);
    // Drop the canvas on unload so the browser reclaims the GPU context
    // promptly (pattern borrowed from omdurman's index.html).
    window.addEventListener('beforeunload', function () {
      document.querySelectorAll('canvas').forEach(function (c) { c.remove(); });
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    // Auto-reload when the WebGL context is lost (GPU switch, sleep, ...).
    new MutationObserver(function () {
      var c = document.querySelector('canvas');
      if (c && !c.dataset.glh) {
        c.dataset.glh = '1';
        c.addEventListener('webglcontextlost', function (e) {
          e.preventDefault();
          setTimeout(function () { window.location.reload(); }, 500);
        });
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
