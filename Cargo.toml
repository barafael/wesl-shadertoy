[package]
name = "wesl-shadertoy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A shadertoy-style live shader editor for WESL, built on Bevy 0.20 and egui, running natively and in the browser via WASM."

# The root package is the app; `crates/` holds tooling around it (see
# README.md). Profiles below apply to every member.
[workspace]
members = [".", "crates/backend-diff"]
# Git worktrees of this repository (agents' and tools') are checkouts of
# their own, not members.
exclude = [".claude"]

[dependencies]
# Bevy 0.20: WESL is the native shader language. Granular feature set: the
# app is a fullscreen render pass + egui, so we skip the `2d`/`3d`/`ui`
# umbrella features (which drag in bevy_pbr, bevy_gltf, gizmos, picking,
# scene, anti-aliasing — tens of MB of wasm) and take only what the vendored
# fullscreen-material plugin and the egui integration actually need.
# `default_platform` already enables `webgl2`, so the wasm build runs in any
# WebGL2 browser; add the `webgpu` feature to require WebGPU instead.
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "default_platform",
    "bevy_render",
    "bevy_core_pipeline",
] }
# Only the core integration is used: egui paints everything, so the optional
# bevy_ui / bevy_picking bridges (and the bevy_ui/bevy_sprite/bevy_picking
# crates they drag into the wasm) stay off.
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
    "open_url",
] }

# The WESL compiler (crate is published as `wesl`, not `wesl-compiler`).
wesl = "0.6"
# Same major as the naga inside wgpu 30 (Bevy 0.20's renderer), so anything
# we validate here is accepted by the pipeline cache there.
naga = { version = "30", features = ["wgsl-in"] }
lucide-icons = "1.61.0"
# JSON-RPC messages to and from the wgsl-analyzer language server.
serde_json = "1"
# Rasterizes the debugger's font atlas from egui's embedded Hack TTF (already
# in the tree through epaint), replacing the reference engine's 1.3 MB font.png.
ab_glyph = "0.2"
# Share links: the document deflated and base64url-encoded into the URL
# fragment (both already in the tree, through png and bevy).
miniz_oxide = "0.8"
base64 = "0.23"

[features]
# Fast native dev rebuilds (same trick as omdurman's app crate): Bevy as a
# dylib. Opt-in, so `cargo build --release` gives a self-contained binary and
# the release profile's `panic = "abort"` does not clash with the dylib's
# unwinding. Use `cargo run --features dev` while iterating.
dev = ["bevy/dynamic_linking"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Offscreen `--render` smoke shots (src/headless.rs): windowless wgpu, a tiny
# block_on for the async adapter/device requests, and PNG encoding.
wgpu = "30"
pollster = "0.4"
png = "0.17"
# `iDate` in local time, as shadertoy has it (the system time zone on every
# desktop OS). The browser build asks JavaScript's `Date` instead.
jiff = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Event",
    "Location",
    "History",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Size-focused release profile for the wasm bundle built by trunk.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Release speed with unwinding, for long fuzz runs: backend-diff reports a
# panicking naga writer as a failed case, which `panic = "abort"` cannot.
# `cargo run --profile fuzz -p backend-diff -- --fuzz 5000`
[profile.fuzz]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"

# Keep native dev builds usable with Bevy in the tree.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
